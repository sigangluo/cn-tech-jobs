name: weekly data audit
on:
  schedule:
    - cron: '0 2 * * 1' # Monday 10:00 Asia/Shanghai
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/update.py
      - name: Summarize quality
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path('site/data/quality.json').read_text())
          print('| 公司 | 职位 | 类别推断 | 缺直达链接 | 缺城市 |')
          print('|---|---:|---:|---:|---:|')
          for c in p['companies']:
              print(f"| {c['name']} | {c['jobs']} | {c['category_inferred']} | {c['missing_direct_link']} | {c['missing_city']} |")
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: quality-report
          path: site/data/quality.json
          retention-days: 90
